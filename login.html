<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເຂົ້າສູ່ລະບົບ - School System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Lao', sans-serif; }</style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold mb-3">🏫</div>
            <h1 class="text-xl font-bold text-slate-800">ເຂົ້າສູ່ລະບົບ</h1>
        </div>

        <!-- ບ໋ອກແຈ້ງເຕືອນຜິດພາດແບບ HTML -->
        <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl text-center"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ຊື່ຢູສເຊີ / ເບີໂທ / ອີເມວ</label>
                <input type="text" id="email" value="" required placeholder="ປ້ອນເບີໂທ ຫຼື ຊື່ຢູສເຊີ ຫຼື ອີເມວ" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ລະຫັດຜ່ານ</label>
                <input type="password" id="password" value="" required class="w-full px-4 py-3 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="btnSubmit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-500/30 cursor-pointer">
                ເຂົ້າສູ່ລະບົບ
            </button>
        </form>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnSubmit');
            const errorBox = document.getElementById('error-box');

            errorBox.classList.add('hidden');
            btn.innerText = "ກຳລັງກວດສອບ...";
            btn.disabled = true;

            try {
                // ດຶງຂໍ້ມູນ Users ທັງໝົດມາ ກວດສອບຝັ່ງ Client ເພື່ອຮອງຮັບທັງ email ແລະ phone
                const querySnapshot = await getDocs(collection(db, "users"));
                let matchedUser = null;

                querySnapshot.forEach((docSnap) => {
                    const userData = docSnap.data();
                    const dbEmail = (userData.email || "").trim();
                    const dbPhone = (userData.phone || "").trim();
                    const dbPassword = (userData.password || "").trim();

                    // ตรวจสอบว่าตรงกับ email หรือ phone และ password ต้องตรงกัน
                    if ((dbEmail === inputVal || dbPhone === inputVal) && dbPassword === password) {
                        matchedUser = {
                            id: docSnap.id,
                            name: userData.name,
                            email: userData.email,
                            phone: userData.phone, // ເກັບເບີໂທໄວ້ໃຊ້ງານກັ່ນຕອງຫ້ອງ
                            role: userData.role   // ເກັບ role ເພື່ອເຊື່ອງເມນູຕັ້ງຄ່າ
                        };
                    }
                });

                if (matchedUser) {
                    // ບັນທຶກຂໍ້ມູນລົງ localStorage ເພື່ອໃຫ້ໜ້າອື່ນດຶງໄປໃຊ້ງານຕໍ່
                    localStorage.setItem('currentUser', JSON.stringify(matchedUser));
                    
                    // 🔄 ເຂົ້າສູ່ລະບົບຖືກຕ້ອງ: ພາໄປໜ້າ index.html ທັນທີ
                    window.location.href = 'index.html';
                } else {
                    // ຖ້າຂໍ້ມູນບໍ່ຖືກຕ້ອງ
                    errorBox.innerText = '❌ ຊື່ຢູສເຊີ, ເບີໂທ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ!';
                    errorBox.classList.remove('hidden');
                    btn.innerText = "ເຂົ້າສູ່ລະບົບ";
                    btn.disabled = false;
                }
            } catch (err) {
                errorBox.innerText = '❌ ເກີດຂໍ້ຜິດພາດ: ' + err.message;
                errorBox.classList.remove('hidden');
                btn.innerText = "ເຂົ້າສູ່ລະບົບ";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
