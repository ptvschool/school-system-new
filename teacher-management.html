<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ຈັດການຂໍ້ມູນຄູ - Teacher Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans Lao', sans-serif; }
        .tab-btn.active {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .tab-btn-danger.active {
            background-color: #dc2626;
            color: white;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-3 sm:p-6 antialiased min-h-screen">

    <div class="max-w-5xl mx-auto space-y-4 sm:space-y-6">
        
        <!-- Header -->
        <div class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-3">
            <div class="p-2.5 sm:p-3 bg-blue-50 text-blue-600 rounded-xl text-xl sm:text-2xl shrink-0">👩‍🏫</div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-800">ຈັດການຂໍ້ມູນຄູ & ເບີໂທສຳລັບລັອກອິນ</h1>
                <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 leading-tight">ເພີ່ມ, ແກ້ໄຂ ແລະ ຈັດການຂໍ້ມູນຄູ, ເບີໂທຕິດຕໍ່ (ໃຊ້ສຳລັບເຂົ້າສູ່ລະບົບ) ພ້ອມທັງລະຫັດຜ່ານ ແລະ ເງິນເດືອນພື້ນຖານ</p>
            </div>
        </div>

        <!-- Main Content: Teacher Management Section -->
        <div class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
            <h3 class="font-bold text-slate-800 text-sm sm:text-base border-b border-slate-100 pb-3 flex items-center gap-2">
                📋 ຟອມບັນທຶກຂໍ້ມູນຄູ, ເບີໂທ ແລະ ລະຫັດຜ່ານ
            </h3>
            
            <form id="teacherCommForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 bg-slate-50 p-3.5 sm:p-4 rounded-xl border border-slate-200">
                <input type="hidden" id="teacherEditId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ຊື່ຄູ</label>
                    <input type="text" id="teacherName" placeholder="ເຊັ່ນ: ອາຈານ ສົມຈິດ" required class="w-full px-3.5 py-2.5 sm:py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ເບີໂທ (Username)</label>
                    <input type="tel" id="teacherPhone" placeholder="ເຊັ່ນ: 02055112233" required class="w-full px-3.5 py-2.5 sm:py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ລະຫັດຜ່ານ (Password)</label>
                    <input type="text" id="teacherPassword" placeholder="ຕັ້ງລະຫັດຜ່ານ" required class="w-full px-3.5 py-2.5 sm:py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ເງິນເດືອນພື້ນຖານ (ກີບ)</label>
                    <input type="number" id="teacherSalary" placeholder="ເຊັ່ນ: 2000000" required class="w-full px-3.5 py-2.5 sm:py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2 lg:col-span-4 flex items-center justify-end gap-2 pt-2">
                    <button type="button" id="btnTeacherCancel" onclick="resetTeacherForm()" class="hidden py-2.5 sm:py-2 px-5 bg-slate-400 hover:bg-slate-500 text-white font-semibold rounded-xl text-sm transition cursor-pointer">
                        ຍົກເລີກ
                    </button>
                    <button type="submit" id="btnTeacherSubmit" class="w-full md:w-auto px-6 py-2.5 sm:py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition cursor-pointer">
                        ➕ ເພີ່ມຄູໃໝ່
                    </button>
                </div>
            </form>

            <div class="overflow-x-auto border border-slate-200 rounded-xl">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                        <tr>
                            <th class="p-3">ຊື່ຄູ</th>
                            <th class="p-3">ເບີໂທ (Username)</th>
                            <th class="p-3">ລະຫັດຜ່ານ</th>
                            <th class="p-3">ເງິນເດືອນພື້ນຖານ (ກີບ)</th>
                            <th class="p-3 text-center w-36 sm:w-40">ຈັດການ</th>
                        </tr>
                    </thead>
                    <tbody id="teacherList" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-4 text-center text-slate-400">ກຳລັງໂຫຼດຂໍ້ມູນ...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all text-center p-6 space-y-4">
            <div id="alertIcon" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-2xl bg-blue-100 text-blue-600">
                🔔
            </div>
            <div>
                <h3 id="alertTitle" class="font-bold text-base text-slate-800">ແຈ້ງເຕືອນ</h3>
                <p id="alertMessage" class="text-xs text-slate-600 mt-1 leading-relaxed"></p>
            </div>
            <button type="button" onclick="closeCustomAlert()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition cursor-pointer">
                ຕົກລົງ
            </button>
        </div>
    </div>

    <!-- Script Firebase & Logic -->
    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.showAlert = (msg, type = 'success', title = 'ແຈ້ງເຕືອນ') => {
            const modal = document.getElementById('customAlertModal');
            const iconEl = document.getElementById('alertIcon');
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = msg;

            if (type === 'success') {
                iconEl.className = 'w-12 h-12 rounded-full flex items-center justify-center mx-auto text-2xl bg-emerald-100 text-emerald-600';
                iconEl.innerText = '✅';
            } else if (type === 'error') {
                iconEl.className = 'w-12 h-12 rounded-full flex items-center justify-center mx-auto text-2xl bg-red-100 text-red-600';
                iconEl.innerText = '❌';
            } else {
                iconEl.className = 'w-12 h-12 rounded-full flex items-center justify-center mx-auto text-2xl bg-blue-100 text-blue-600';
                iconEl.innerText = 'ℹ️';
            }

            modal.classList.remove('hidden');
        };

        window.closeCustomAlert = () => {
            document.getElementById('customAlertModal').classList.add('hidden');
        };

        window.deleteTeacherDoc = async (id) => {
            if(confirm('ທ່ານຕ້ອງການລົບຂໍ້ມູນຄູ້ນີ້ ແທ້ບໍ?')) {
                try {
                    await deleteDoc(doc(db, "setting_teachers", id));
                    showAlert('ລົບຂໍ້ມູນຄູຮຽບຮ້ອຍແລ້ວ!', 'success');
                    loadTeachers();
                } catch(err) {
                    showAlert('ລົບບໍ່ສຳເລັດ: ' + err.message, 'error');
                }
            }
        };

        const teacherCommForm = document.getElementById('teacherCommForm');
        
        async function loadTeachers() {
            const snap = await getDocs(collection(db, "setting_teachers"));
            const tbody = document.getElementById('teacherList');
            tbody.innerHTML = '';
            snap.forEach(d => {
                const data = d.data();
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-medium text-slate-800">${data.name}</td>
                        <td class="p-3 font-mono text-blue-600 font-semibold">${data.phone || '-'}</td>
                        <td class="p-3 font-mono text-slate-600">${data.password ? '••••••' : '-'}</td>
                        <td class="p-3 text-emerald-600 font-bold">${Number(data.salary || 0).toLocaleString()} ₭</td>
                        <td class="p-3 text-center space-x-2 whitespace-nowrap">
                            <button onclick="editTeacher('${d.id}', '${data.name}', '${data.phone || ''}', '${data.password || ''}', ${data.salary || 0})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold cursor-pointer">✏️ ແກ້ໄຂ</button>
                            <button onclick="deleteTeacherDoc('${d.id}')" class="text-red-500 hover:text-red-700 text-xs font-semibold cursor-pointer">🗑️ ລົບ</button>
                        </td>
                    </tr>`;
            });
            if(snap.empty) tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">ບໍ່ມີຂໍ້ມູນຄູ</td></tr>';
        }

        window.editTeacher = (id, name, phone, password, salary) => {
            document.getElementById('teacherEditId').value = id;
            document.getElementById('teacherName').value = name;
            document.getElementById('teacherPhone').value = phone;
            document.getElementById('teacherPassword').value = password;
            document.getElementById('teacherSalary').value = salary;
            document.getElementById('btnTeacherSubmit').innerText = '💾 ອັບເດດຂໍ້ມູນຄູ';
            document.getElementById('btnTeacherCancel').classList.remove('hidden');
        };

        window.resetTeacherForm = () => {
            teacherCommForm.reset();
            document.getElementById('teacherEditId').value = '';
            document.getElementById('btnTeacherSubmit').innerText = '➕ ເພີ່ມຄູໃໝ່';
            document.getElementById('btnTeacherCancel').classList.add('hidden');
        };

        teacherCommForm.onsubmit = async (e) => {
            e.preventDefault();
            const editId = document.getElementById('teacherEditId').value;
            const nameVal = document.getElementById('teacherName').value.trim();
            const phoneVal = document.getElementById('teacherPhone').value.trim();
            const passVal = document.getElementById('teacherPassword').value.trim();
            const salaryVal = Number(document.getElementById('teacherSalary').value);

            try {
                if(editId) {
                    await updateDoc(doc(db, "setting_teachers", editId), { 
                        name: nameVal, 
                        phone: phoneVal, 
                        password: passVal,
                        salary: salaryVal 
                    });
                    showAlert('ອັບເດດຂໍ້ມູນຄູສຳເລັດ!', 'success');
                } else {
                    await addDoc(collection(db, "setting_teachers"), { 
                        name: nameVal, 
                        phone: phoneVal, 
                        password: passVal,
                        salary: salaryVal 
                    });
                    showAlert('ເພີ່ມຄູສຳເລັດ!', 'success');
                }
                resetTeacherForm();
                loadTeachers();
            } catch(err) {
                showAlert(err.message, 'error');
            }
        };

        // Initial Load
        loadTeachers();
    </script>
</body>
</html>
